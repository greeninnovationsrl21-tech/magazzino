<html lang="it">
<head>
<script>
/* Versione GitHub del magazzino: accesso con utente e password, dati dall'App web di Apps Script senza account Google del browser. */
window.API_URL = 'https://script.google.com/macros/s/AKfycbwN_R1mXdcLe5jI3nMZn3qtxMFuYFjJxq-pq3nGreJle0TtoRSOkiGnnkY1rLpsey4L/exec';
(function(){
  function leggi(k){ try { return localStorage.getItem(k) || ''; } catch(e) { return ''; } }
  function scrivi(k, v){ try { if (v) localStorage.setItem(k, v); else localStorage.removeItem(k); } catch(e) {} }
  window.MODO = 'magazzino'; window.CHIAVE = ''; window.PREZZI = false;
  window.RUOLO = leggi('gi_mag_ruolo');
  var gettone = leggi('gi_mag_gettone'), attesa = null;

  function post(fn, args){
    return fetch(window.API_URL, {method:'POST', credentials:'omit', redirect:'follow',
      headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify({fn: fn, args: args})})
      .then(function(r){ return r.json(); })
      .then(function(j){ if (!j.ok) throw new Error(j.err || 'Errore'); return j.res; });
  }
  function aggiornaTesta(){
    var w = document.querySelector('.who span'); if (w && window.RUOLO) w.textContent = 'Magazzino · ' + window.RUOLO;
  }
  function accedi(){
    if (attesa) return attesa;
    attesa = new Promise(function(fatto){
      var d = document.createElement('div'); d.id = 'login';
      d.innerHTML = '<form class="lg-card"><div class="lg-logo">GI</div><h2>Magazzino</h2><p>Green Innovation · accedi con le tue credenziali</p>' +
        '<label>Utente<input id="lg-u" autocomplete="username" autocapitalize="none" spellcheck="false" required></label>' +
        '<label>Password<input id="lg-p" type="password" autocomplete="current-password" required></label>' +
        '<div id="lg-err" role="alert"></div><button id="lg-b" type="submit">Entra</button></form>';
      document.body.appendChild(d);
      setTimeout(function(){ document.getElementById('lg-u').focus(); }, 50);
      d.querySelector('form').onsubmit = function(ev){
        ev.preventDefault();
        var b = document.getElementById('lg-b'), err = document.getElementById('lg-err');
        b.disabled = true; b.textContent = 'Controllo…'; err.textContent = '';
        post('loginMagazzino', [document.getElementById('lg-u').value, document.getElementById('lg-p').value]).then(function(r){
          gettone = r.gettone; scrivi('gi_mag_gettone', gettone);
          window.RUOLO = r.ruolo; scrivi('gi_mag_ruolo', r.ruolo); aggiornaTesta();
          if (!leggi('gi_chi') && r.nome) scrivi('gi_chi', r.nome);
          d.remove(); attesa = null; fatto();
        }, function(e){
          err.textContent = String(e && e.message || e); b.disabled = false; b.textContent = 'Entra';
        });
      };
    });
    return attesa;
  }
  function chiama(fn, args, giaRiprovato){
    var pronto = gettone ? Promise.resolve() : accedi();
    return pronto.then(function(){
      var a = args.slice(); a[a.length ? a.length - 1 : 0] = gettone;
      return post(fn, a);
    }).catch(function(e){
      if (/^LOGIN:/.test(String(e && e.message)) && !giaRiprovato) {
        gettone = ''; scrivi('gi_mag_gettone', '');
        return chiama(fn, args, true);
      }
      throw e;
    });
  }
  function runner(ok, ko){
    return new Proxy({}, {get: function(_, p){
      if (p === 'withSuccessHandler') return function(f){ return runner(f, ko); };
      if (p === 'withFailureHandler') return function(f){ return runner(ok, f); };
      return function(){ var a = Array.prototype.slice.call(arguments);
        chiama(p, a).then(function(r){ if (ok) ok(r); aggiornaTesta(); }, function(e){ if (ko) ko(e); else console.error(e); }); };
    }});
  }
  window.google = {script: {run: runner(null, null)}};
  document.addEventListener('DOMContentLoaded', function(){
    aggiornaTesta();
    var r = document.getElementById('refresh'); if (!r) return;
    var esci = document.createElement('button'); esci.className = 'iconbtn'; esci.title = 'Esci'; esci.setAttribute('aria-label', 'Esci');
    esci.innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>';
    esci.onclick = function(){ scrivi('gi_mag_gettone', ''); scrivi('gi_mag_ruolo', ''); scrivi('gi_chi', ''); location.reload(); };
    r.parentNode.insertBefore(esci, r);
  });
})();
</script>

function mostraErrore(msg){

<script>
const MESI = ['GENNAIO','FEBBRAIO','MARZO','APRILE','MAGGIO','GIUGNO','LUGLIO','AGOSTO','SETTEMBRE','OTTOBRE','NOVEMBRE','DICEMBRE'];
/* ===== OBIETTIVI MODIFICABILI ===== */
const CFG = {
  OBIETTIVO_VENDITE_MESE: 50,                                   /* contratti al mese (totale azienda) */
  OBIETTIVI_VENDITORI: { FRANCESCO: 17, LUCA: 17, ROBERTO: 16 } /* contratti al mese per venditore */
};
/* ================================== */
const MS = ['Gen','Feb','Mar','Apr','Mag','Giu','Lug','Ago','Set','Ott','Nov','Dic'];
const MESE_IT = ['gennaio','febbraio','marzo','aprile','maggio','giugno','luglio','agosto','settembre','ottobre','novembre','dicembre'];
const eur = new Intl.NumberFormat('it-IT',{style:'currency',currency:'EUR',maximumFractionDigits:0});
const eur2 = eur;
const n0 = new Intl.NumberFormat('it-IT',{maximumFractionDigits:0});
const n1 = new Intl.NumberFormat('it-IT',{maximumFractionDigits:1});
const pc = new Intl.NumberFormat('it-IT',{style:'percent',maximumFractionDigits:0});
const kEur = v => v>=1e6 ? n1.format(v/1e6)+'M' : v>=1000 ? n0.format(Math.round(v/1000))+'k' : n0.format(v);
const U = s => String(s==null?'':s).replace(/\s+/g,' ').trim().toUpperCase();
const esc = s => String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const cap = s => esc(String(s||'').toLowerCase().replace(/(^|[\s'(-])\S/g,m=>m.toUpperCase()));
const NUMF = /\d+\s*\/\s*\d{2,4}/;
const netto = x => x - (x/1.22)*0.11;
const oggi = () => { const d = new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); };
const dIt = s => s ? new Date(s+'T00:00:00').toLocaleDateString('it-IT',{day:'numeric',month:'short'}) : '';
const isoAdd = (s,days) => { const d = new Date(s+'T00:00:00'); d.setDate(d.getDate()+days); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); };

let D = null;
let vista = 'panoramica';
try { vista = localStorage.getItem('gi_v2') || 'panoramica'; } catch (e) {}
if (location.hash.length > 1) vista = location.hash.slice(1);
const S = { view: vista, per: 'mese', anno: null, voce: 'Saldo', todo: 'installare', pf: '', pq: '', sheet: null };

const VIEWS = [
  ['panoramica','Panoramica','<path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>'],
  ['obiettivi','Obiettivi','<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4"/>'],
  ['pratiche','Pratiche','<path d="M14 3H6a1 1 0 0 0-1 1v16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V8z"/><path d="M14 3v5h5M9 13h6M9 17h6"/>'],
  ['incassi','Incassi','<rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18M7 15h3"/>'],
  ['magazzino','Magazzino','<path d="M3 9l9-5 9 5v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1z"/><path d="M8 20v-7h8v7M8 16h8"/>'],
];
const MODO = window.MODO || 'tutto', CHIAVE = window.CHIAVE || '', RUOLO = window.RUOLO || '';
const VEDI_PREZZI = MODO !== 'magazzino' || window.PREZZI === true;
if (MODO === 'magazzino') { VIEWS.splice(0, VIEWS.length, ...VIEWS.filter(v => v[0] === 'magazzino')); S.view = 'magazzino'; }
if (!VIEWS.some(v => v[0] === S.view)) S.view = VIEWS[0][0];

/* ---------- utilità dati ---------- */
const anni = () => D.settings.map(s => s.anno);
function rowsAnno(a){ const s = D.settings.find(x => x.anno === a); return s ? D.rows.filter(r => r.r >= s.inizio && r.r <= s.fine && r.nome) : []; }
const mn = r => MESI.indexOf(U(r.mese)) + 1;
const sum = (X,k) => X.reduce((s,r) => s + (Number(typeof k === 'function' ? k(r) : r[k]) || 0), 0);
const media = X => { const c = X.filter(r => Number(r.pda) > 0); return c.length ? sum(c,'pda')/c.length : 0; };
function stCls(s){ s = U(s); if (s === 'IN LAVORAZIONE') return 's-lav'; if (/^OK\W*DA\W*INSTALLARE$/.test(s)) return 's-ok'; if (/ORGANIZZAT/.test(s)) return 's-org'; if (s.includes('DOCUMENTI')) return 's-doc'; if (s === 'COMPLETATA') return 's-comp'; if (s.startsWith('SOSPES')) return 's-sosp'; if (s === 'RECESSO' || s === 'NON FINANZIABILE') return 's-rec'; return 's-sosp'; }
function fasePill(p){ return p.org ? '<span class="pill p-org">📅 Organizzata</span>' : p.ok ? '<span class="pill p-ok">OK da installare</span>' : '<span class="pill p-info">In lavorazione</span>'; }
function stNome(s){ s = U(s); if (s.includes('DOCUMENTI')) return 'Installato · documenti'; if (/^OK\W*DA\W*INSTALLARE$/.test(s)) return 'OK da installare'; if (/ORGANIZZAT/.test(s)) return 'Installazione organizzata'; return cap(s) || '—'; }
function impianto(r){ const p = []; if (r.kw) p.push(n1.format(r.kw)+' kWp'); if (String(r.kwh||'').trim()) p.push(r.kwh+' kWh'); return p.join(' + ') || cap(r.tipo) || '—'; }
const curY = () => { const y = new Date().getFullYear(); return anni().includes(y) ? y : anni()[anni().length-1]; };
const curM = () => S.anno === new Date().getFullYear() ? new Date().getMonth()+1 : Math.max(1, ...rowsAnno(S.anno).map(mn));
function rowsMese(y, m){ while (m < 1) { m += 12; y--; } return rowsAnno(y).filter(r => mn(r) === m); }
function deltaPct(a, b){ if (!b) return null; return a/b - 1; }
function deltaHtml(d, suffix){ if (d == null || !isFinite(d)) return `<span class="delta flat">— ${suffix}</span>`; const cls = d > 0.004 ? 'up' : d < -0.004 ? 'down' : 'flat'; return `<span class="delta ${cls}">${d>0?'▲':d<0?'▼':'='} ${pc.format(Math.abs(d))} ${suffix}</span>`; }
function deltaNum(a, b, suffix){ const d = a - b; const cls = d > 0 ? 'up' : d < 0 ? 'down' : 'flat'; return `<span class="delta ${cls}">${d>0?'▲ +':d<0?'▼ ':'= '}${d} ${suffix}</span>`; }
function chart(data, lab, nowIdx, fmt){
  const max = Math.max(1, ...data);
  return `<div class="chart">${data.map((v,k) => `<div class="col ${k===nowIdx?'now':''}" title="${lab[k]}: ${fmt?fmt(v):v}"><span class="v">${fmt?fmt(v):v}</span><div class="b" style="height:${Math.max(2,Math.round(v/max*100))}%"></div><span class="m">${lab[k]}</span></div>`).join('')}</div>`;
}
function ring(o){
  const p = o.goal ? o.done/o.goal : null, r = 38, C = 2*Math.PI*r, pp = p == null ? 0 : Math.min(1,p);
  const arco = p == null || pp === 0 ? '' : `<circle class="p" cx="46" cy="46" r="${r}" fill="none" stroke="${o.c}" stroke-width="8" stroke-linecap="round" stroke-dasharray="${C*pp} ${C}"/>`;
  const centro = p == null ? `${o.done}<small>contratti</small>` : `${pc.format(p)}<small>raggiunto</small>`;
  return `<div class="card lift ring-card"><div class="ring-top"><span class="ico" style="background:${o.c}22;color:${o.c}">${o.i}</span><span class="tag">${o.tag}</span></div>
  <div class="ring"><svg viewBox="0 0 92 92"><circle cx="46" cy="46" r="${r}" fill="none" stroke="${p == null ? o.c : 'currentColor'}" stroke-opacity="${p == null ? '.25' : '.12'}" stroke-width="8"/>${arco}</svg><div class="pct"><div>${centro}</div></div></div>
  <div class="ring-name">${esc(o.n)}</div><div class="ring-val">${o.val || (o.goal ? `${o.done} di ${o.goal}` : 'nessun obiettivo')}</div></div>`;
}
const COLORI = ['#e2652e','#3f6fb5','#2f8f5b','#9b6bff','#c98a12','#d4447a','#2a9d9f','#7a5c45'];
function agenti(R){ const g = {}; R.forEach(r => { const k = U(r.agente) || 'N/D'; g[k] = g[k] || {n:0, v:0}; g[k].n++; g[k].v += Number(r.pda)||0; }); return g; }

function fattura(f){
  const s = String(f||'').trim(), m = s.match(NUMF);
  if (m) return {cls:'p-ok', t:'✓ '+m[0].replace(/\s/g,'')};
  if (s) return {cls:'p-wait', t:'⏳ '+U(s).replace('FFATTURA','FATTURA')};
  return {cls:'p-no', t:'✕ Non inviata'};
}
function incassi(){
  const out = []; const add = (r,voce,imp,f) => out.push({nome:r.nome, agente:r.agente, voce, imp:Number(imp)||0, f:fattura(f)});
  D.rows.filter(r => r.nome).forEach(r => {
    if (U(r.statoMon) === 'DA PAGARE') add(r,'Monitoraggio',r.mon,r.fattMon);
    if (U(r.statoAcc) === 'DA PAGARE') add(r,'Acconto',r.acc,r.fattAcc);
    if (U(r.statoSaldo) === 'DA PAGARE') add(r,'Saldo',r.saldo,r.fattSaldo);
    if (U(r.statoSaldo).includes('FINANZIAMENTO')) add(r,'Finanziamento',r.saldo,r.fattSaldo);
  });
  return out.sort((a,b) => b.imp - a.imp);
}
const TODO = [
  ['installare','Da installare', r => U(r.statoInst) === 'DA INSTALLARE'],
  ['fattacc','Fattura acconto', r => U(r.fattAcc).includes('DA FARE')],
  ['fattsaldo','Fattura saldo', r => U(r.fattSaldo).includes('DA FARE')],
  ['dico','DICO da fare', r => U(r.dico) === 'DA FARE' && U(r.statoInst) === 'INSTALLATO'],
  ['allaccio','Allaccio da inviare', r => U(r.allaccio) === 'DA INVIARE' && U(r.statoInst) === 'INSTALLATO'],
];

/* ---------- shell ---------- */
const ico = p => `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
function shell(){
  if (MODO === 'magazzino') { document.getElementById('rail').style.display = 'none'; const w = document.querySelector('.who span'); if (w) w.textContent = 'Magazzino' + (RUOLO ? ' · ' + RUOLO : ''); document.querySelector('.ask input').placeholder = 'Cerca un articolo o un cliente…'; }
  document.getElementById('rail').innerHTML = VIEWS.map(([k,l,p]) => `<button data-go="${k}" data-tip="${l}" aria-label="${l}" class="${S.view===k?'on':''}">${ico(p)}</button>`).join('');
  document.getElementById('nav').innerHTML = VIEWS.map(([k,l]) => `<button class="tab ${S.view===k?'on':''}" data-go="${k}">${l}</button>`).join('') + `<button class="tab plus" id="plus" aria-label="Registra carico merce" title="Registra carico merce">+</button>`;
  document.getElementById('upd').textContent = D ? 'aggiornata alle ' + D.aggiornato : '';
}
function vai(v){ if (!VIEWS.some(x => x[0] === v)) v = VIEWS[0][0]; S.view = v; S.sheet = null; try { localStorage.setItem('gi_v2', v); } catch (e) {} try { history.replaceState(null,'','#'+v); } catch (e) {} window.scrollTo({top:0}); render(); }

function render(){
  if (!D) return;
  shell();
  const f = {panoramica, obiettivi, pratiche, incassi: vIncassi, magazzino: renderMag}[S.view] || panoramica;
  document.getElementById('main').innerHTML = f();
  dopo();
}
function dopo(){ (window._dopo || []).forEach(fn => fn()); window._dopo = []; }
const poi = fn => (window._dopo = window._dopo || []).push(fn);

/* ---------- PANORAMICA ---------- */
function periodo(per, off){
  const y = curY(), m = new Date().getMonth()+1;
  if (per === 'mese') return rowsMese(y, m - off);
  if (per === 'anno') { const R = rowsAnno(y - off); return off ? R.filter(r => mn(r) > 0 && mn(r) <= m) : R; }
  const fine = isoAdd(oggi(), -7*off), inizio = isoAdd(fine, -6);
  return D.rows.filter(r => r.nome && r.dataPda && r.dataPda >= inizio && r.dataPda <= fine);
}
function panoramica(){
  const y = curY(), m = new Date().getMonth()+1, per = S.per;
  const R = periodo(per,0), P = periodo(per,1);
  const vs = {mese: 'vs ' + MESE_IT[(m+10)%12], anno: 'vs ' + (y-1) + ' stesso periodo', settimana: 'vs settimana prima'}[per];
  const titoloPer = {mese: MESE_IT[m-1] + ' ' + y, anno: 'anno ' + y, settimana: 'ultimi 7 giorni'}[per];
  const Rm = rowsMese(y, m), goal = CFG.OBIETTIVO_VENDITE_MESE;
  const serie = [5,4,3,2,1,0].map(o => { let mm = m - o, yy = y; while (mm < 1) { mm += 12; yy--; } return {l: MS[mm-1], v: rowsMese(yy, mm).length}; });
  const ag = agenti(Rm);
  const nomi = [...new Set([...Object.keys(CFG.OBIETTIVI_VENDITORI), ...Object.keys(ag)])].filter(k => k !== 'N/D');
  const rings = nomi.map((k,i) => ({n: cap(k), i: k[0], c: COLORI[i % COLORI.length], done: (ag[k]||{}).n || 0, goal: CFG.OBIETTIVI_VENDITORI[k] || 0, tag: 'Vendite'}))
    .sort((a,b) => (b.goal>0)-(a.goal>0) || b.done - a.done);
  const todo = TODO.map(([id,l,fn]) => [id, l, D.rows.filter(r => r.nome && fn(r)).length]);
  const I = incassi(), daInc = netto(I.filter(x => x.voce !== 'Monitoraggio').reduce((s,x) => s + x.imp, 0));
  const ultime = D.rows.filter(r => r.nome && r.dataPda).sort((a,b) => b.dataPda.localeCompare(a.dataPda) || b.r - a.r);
  const q = (S.q1 || '').toUpperCase();
  const ul = ultime.filter(r => !q || U(r.nome).includes(q) || U(r.comune).includes(q)).slice(0, 6);
  poi(() => { document.querySelectorAll('#per button').forEach(b => b.onclick = () => { S.per = b.dataset.p; render(); });
    const i = document.getElementById('q1'); if (i) i.oninput = () => { S.q1 = i.value; clearTimeout(window._t1); window._t1 = setTimeout(() => { render(); const n = document.getElementById('q1'); n.focus(); n.setSelectionRange(n.value.length, n.value.length); }, 250); }; });
  const ora = new Date().getHours(), saluto = ora < 13 ? 'Buongiorno' : ora < 18 ? 'Buon pomeriggio' : 'Buonasera';
  return `<div class="fade" style="display:flex;flex-direction:column;gap:18px">
    <div class="head"><div><h1>${saluto}, Jacopo</h1><p class="sub">${cap(titoloPer)} · Treviso, Venezia, Padova</p></div>
      <div class="seg" id="per">${[['settimana','Settimana'],['mese','Mese'],['anno','Anno']].map(([k,l]) => `<button data-p="${k}" class="${per===k?'on':''}">${l}</button>`).join('')}</div></div>
    <div class="kpis">
      <div class="card lift kpi-accent"><div class="label">Venduto PDA · ${titoloPer}</div><div class="big">${eur.format(sum(R,'pda'))}</div>${deltaHtml(deltaPct(sum(R,'pda'), sum(P,'pda')), vs)}</div>
      <div class="card lift"><div class="label">Contratti</div><div class="big">${R.length}</div>${deltaNum(R.length, P.length, vs)}</div>
      <div class="card lift"><div class="label">Media PDA</div><div class="big">${eur.format(media(R))}</div>${deltaHtml(deltaPct(media(R), media(P)), vs)}</div>
      <div class="card lift"><div class="label">Da incassare (netto)</div><div class="big">${eur.format(daInc)}</div><span class="delta flat">${I.filter(x=>x.voce!=='Monitoraggio'&&x.f.cls!=='p-ok').length} senza fattura</span></div>
    </div>
    <div class="grid-top">
      <div class="card hero">
        <div><div class="label">Vendite di ${MESE_IT[m-1]}</div>
          <div class="big">${Rm.length} <span class="muted" style="font-size:16px;font-family:var(--f-body)">/ ${goal}</span></div>
          ${deltaNum(Rm.length, rowsMese(y, m-1).length, 'vs ' + MESE_IT[(m+10)%12])}
          <div class="bar-track"><span style="width:${Math.min(100, Rm.length/goal*100)}%"></span></div>
          <p class="muted" style="margin:8px 0 0">${pc.format(Rm.length/goal)} dell'obiettivo di ${goal} vendite al mese</p></div>
        <div><div class="label" style="text-align:right">Contratti per mese</div>${chart(serie.map(s=>s.v), serie.map(s=>s.l), 5)}</div>
      </div>
      <div class="card">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px"><div class="title">Da fare oggi</div><span class="chip">${todo.reduce((s,t)=>s+t[2],0)} cose</span></div>
        ${todo.map(([id,l,n]) => `<div class="row" style="cursor:pointer" data-todo="${id}"><div class="ic">${n}</div><div><div class="t">${l}</div><div class="d">${n ? 'Apri l\'elenco dei clienti' : 'Niente in sospeso'}</div></div><div class="r">›</div></div>`).join('')}
      </div>
    </div>
    <div><div class="head" style="margin-bottom:12px"><div class="title">Obiettivi venditori · ${MESE_IT[m-1]}</div><button class="pill-dark" data-go="obiettivi">Vedi tutti</button></div>
      <div class="rings">${rings.slice(0,5).map(ring).join('')}</div></div>
    <div class="card">
      <div class="head" style="margin-bottom:10px"><div class="title">Ultime pratiche</div>
        <label class="search">${ico('<circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/>')}<input id="q1" placeholder="Cerca cliente" value="${esc(S.q1||'')}"></label></div>
      <div class="tablewrap">${tabPratiche(ul, false)}</div>
    </div>
  </div>`;
}
function tabPratiche(list, full){
  return `<table><thead><tr><th>Cliente</th>${full?'<th>Comune</th>':''}<th>Impianto</th><th>Venditore</th><th class="num">Importo</th><th>Stato</th><th>Data PDA</th></tr></thead><tbody>

}

/* ---------- OBIETTIVI ---------- */
function obiettivi(){
  const y = S.anno, set = D.settings.find(s => s.anno === y) || {}, R = rowsAnno(y), m = curM();
  const pda = sum(R,'pda'), ob = set.obiettivo || 0, manc = Math.max(0, ob - pda), med = media(R);
  const chiuso = y < new Date().getFullYear(), mesi = chiuso ? 0 : 12 - m + 1;
  const mensili = MS.map((l,i) => sum(R.filter(r => mn(r) === i+1),'pda'));
  const Rm = rowsMese(y, m), ag = agenti(Rm), agA = agenti(R);
  const nomi = [...new Set([...Object.keys(CFG.OBIETTIVI_VENDITORI), ...Object.keys(ag)])].filter(k => k !== 'N/D');
  const rings = nomi.map((k,i) => ({n: cap(k), i: k[0], c: COLORI[i % COLORI.length], done: (ag[k]||{}).n || 0, goal: CFG.OBIETTIVI_VENDITORI[k] || 0, tag: MESE_IT[m-1]}))
    .sort((a,b) => (b.goal>0)-(a.goal>0) || b.done - a.done);
  const kwp = sum(Rm,'kw'), acc = Rm.filter(r => String(r.bat||'').trim() || String(r.kwh||'').trim()).length;
  const P = rowsAnno(y-1).filter(r => mn(r) > 0 && mn(r) <= m), pdaPrec = P.length ? sum(P,'pda') : 0;
  const extra = [
    {n:'Obiettivo annuale PDA', i:'€', c:'#e2652e', done: Math.round(pda/1000), goal: Math.round(ob/1000), tag: String(y), val: `${kEur(pda)} di ${kEur(ob)} €`},
    {n:'Vendite del mese', i:'★', c:'#3f6fb5', done: Rm.length, goal: CFG.OBIETTIVO_VENDITE_MESE, tag: MESE_IT[m-1]},
    {n:'kWp venduti', i:'☀', c:'#c98a12', done: Math.round(kwp), goal: 0, tag: MESE_IT[m-1], val: `${n1.format(kwp)} kWp · media ${Rm.length ? n1.format(kwp/Rm.length) : 0}`},
    {n:'Con accumulo', i:'⚡', c:'#2f8f5b', done: acc, goal: Rm.length, tag: MESE_IT[m-1], val: `${acc} impianti su ${Rm.length}`},
  ];
  const clas = Object.entries(agA).filter(([k]) => k !== 'N/D').sort((a,b) => b[1].v - a[1].v);
  poi(() => document.querySelectorAll('#anniSeg button').forEach(b => b.onclick = () => { S.anno = Number(b.dataset.a); render(); }));
  return `<div class="fade" style="display:flex;flex-direction:column;gap:18px">
    <div class="head"><div><h1>Obiettivi e traguardi</h1><p class="sub">${chiuso ? `Anno ${y} chiuso` : `Mancano ${eur.format(manc)} all'obiettivo ${y}: circa ${n1.format(med ? manc/med : 0)} PDA, ${n1.format(mesi && med ? manc/med/mesi : 0)} al mese`}</p></div>
      <div class="seg" id="anniSeg">${anni().map(a => `<button data-a="${a}" class="${a===y?'on':''}">${a}</button>`).join('')}</div></div>
    <div class="grid-top">
      <div class="card hero">
        <div><div class="label">Venduto PDA ${y}</div><div class="big">${eur.format(pda)}</div>
          ${pdaPrec ? deltaHtml(deltaPct(pda, pdaPrec), 'vs ' + (y-1) + ' stesso periodo') : '<span class="delta flat">nessun confronto</span>'}
          <div class="bar-track"><span style="width:${ob ? Math.min(100, pda/ob*100) : 0}%"></span></div>
          <p class="muted" style="margin:8px 0 0">${ob ? pc.format(pda/ob) : '—'} di ${eur.format(ob)} · media ${eur.format(med)} a PDA</p></div>
        <div><div class="label" style="text-align:right">Venduto PDA per mese</div>${chart(mensili, MS.map(s=>s[0]), m-1, kEur)}</div>
      </div>
      <div class="card"><div class="title" style="margin-bottom:4px">Classifica ${y}</div>
        ${clas.map(([k,x],i) => `<div class="row"><div class="ic">${i+1}</div><div><div class="t">${cap(k)}</div><div class="d">${x.n} contratti · media ${eur.format(x.n ? x.v/x.n : 0)}</div></div><div class="r" style="font-family:var(--f-display);font-weight:600;font-size:16px">${kEur(x.v)} €</div></div>`).join('') || '<div class="empty">Nessun contratto</div>'}
      </div>
    </div>
    <div class="title">Venditori · ${MESE_IT[m-1]} ${y}</div>
    <div class="rings">${rings.map(ring).join('')}</div>
    <div class="title">Azienda</div>
    <div class="rings">${extra.map(ring).join('')}</div>
    <p class="muted" style="margin:0">Gli obiettivi dei venditori (${Object.entries(CFG.OBIETTIVI_VENDITORI).map(([k,v]) => cap(k)+' '+v).join(', ')}) e le ${CFG.OBIETTIVO_VENDITE_MESE} vendite al mese si cambiano in cima al file PaginaDashboard; l'obiettivo annuale nella tabella IMPOSTAZIONI del foglio.</p>
  </div>`;
}

/* ---------- PRATICHE ---------- */

  const todo = TODO.map(([id,l,fn]) => [id, l, D.rows.filter(r => r.nome && fn(r))]);

      <div class="tiles">${todo.map(([id,l,X]) => `<button class="tile ${id===sel[0]?'on':''}" data-t="${id}"><div class="big">${X.length}</div><div class="muted" style="font-weight:600">${l}</div></button>`).join('')}</div>
      <div class="tablewrap" style="margin-top:12px;max-height:340px"><table><thead><tr><th>Cliente</th><th>Comune</th><th>Venditore</th><th>Stato</th>${sel[0]==='installare'?'<th>Inizio</th>':''}</tr></thead><tbody>
      ${sel[2].map(r => `<tr><td style="font-weight:700">${esc(r.nome)}</td><td>${cap(r.comune)}</td><td>${cap(r.agente)}</td><td><span class="st ${stCls(r.stato)}">${stNome(r.stato)}</span></td>${sel[0]==='installare'?`<td class="muted">${dIt(r.dataInst)||'—'}</td>`:''}</tr>`).join('') || '<tr><td colspan="5" class="empty">Niente da fare qui 🎉</td></tr>'}

/* ---------- INCASSI ---------- */
function vIncassi(){
  const I = incassi(), voci = ['Acconto','Saldo','Finanziamento','Monitoraggio'];
  const tot = v => I.filter(x => x.voce === v).reduce((s,x) => s + x.imp, 0);
  const lordo = ['Acconto','Saldo','Finanziamento'].reduce((s,v) => s + tot(v), 0);
  const X = I.filter(x => x.voce === S.voce);
  poi(() => document.querySelectorAll('#voci button').forEach(b => b.onclick = () => { S.voce = b.dataset.v; render(); }));
  return `<div class="fade" style="display:flex;flex-direction:column;gap:18px">
    <div class="head"><div><h1>Da incassare</h1><p class="sub">Tutti gli anni · netto = lordo meno l'11% sull'imponibile</p></div></div>
    <div class="kpis">
      <div class="card lift kpi-accent"><div class="label">Totale netto</div><div class="big">${eur.format(netto(lordo))}</div><span class="delta">lordo ${eur.format(lordo)}</span></div>
      ${['Acconto','Saldo','Finanziamento'].map(v => { const Y = I.filter(x => x.voce === v); const sf = Y.filter(x => x.f.cls !== 'p-ok').length;
        return `<div class="card lift"><div class="label">${({Acconto:'Acconti',Saldo:'Saldi',Finanziamento:'Finanziamenti'})[v]} (netto)</div><div class="big">${eur.format(netto(tot(v)))}</div><span class="delta ${sf?'down':'up'}">${Y.length} clienti · ${sf} senza fattura</span></div>`; }).join('')}
    </div>
    <div class="card">
      <div class="head" style="margin-bottom:10px">
        <div class="seg" id="voci">${voci.map(v => `<button data-v="${v}" class="${v===S.voce?'on':''}">${v}<span class="n">${I.filter(x=>x.voce===v).length}</span></button>`).join('')}</div>
        <span class="muted">${S.voce}: ${eur.format(tot(S.voce))} lordi${S.voce==='Monitoraggio'?' · escluso dal totale':''}</span></div>
      <div class="tablewrap"><table><thead><tr><th>Cliente</th><th>Venditore</th><th class="num">Importo</th><th>Fattura</th></tr></thead><tbody>
      ${X.map(x => `<tr><td style="font-weight:700">${esc(x.nome)}</td><td>${cap(x.agente)}</td><td class="num">${eur.format(x.imp)}</td><td><span class="pill ${x.f.cls}">${esc(x.f.t)}</span></td></tr>`).join('') || '<tr><td colspan="4" class="empty">Nessuno 🎉</td></tr>'}
      </tbody></table></div>
    </div>
  </div>`;
}

/* ---------- MAGAZZINO ---------- */
const SL2 = '/' + '/';
const NORM = s => String(s==null?'':s).toUpperCase().split(SL2).map(x => x.trim()).join(' ' + SL2 + ' ').replace(/\s+/g,' ').trim();
const CATS = { PANNELLI:{l:'Pannelli',i:'▦',c:'#3f6fb5'}, INVERTER:{l:'Inverter',i:'ϟ',c:'#c98a12'}, BATTERIA:{l:'Batterie',i:'▮',c:'#2f8f5b'}, EXTRA:{l:'Extra',i:'✦',c:'#9b6bff'} };
const catOf = c => { c = U(c); if (c.startsWith('PANN')) return 'PANNELLI'; if (c.startsWith('INV')) return 'INVERTER'; if (c.startsWith('BAT')) return 'BATTERIA'; return 'EXTRA'; };
const parti = n => { const p = String(n).split(SL2); return p.length > 1 ? {tag:p[0].trim(), nome:p.slice(1).join(SL2).trim()} : {tag:'', nome:String(n).trim()}; };
function calcMag(){
  const M = D.magazzino || {};
  const acquisti = M.acquisti || [], inizio = M.inizio || '';
  const ana = {}; (M.anagrafica||[]).forEach(a => ana[NORM(a.art)] = a);
  const prezzi = {}; (M.prezzi||[]).forEach(([n,p]) => { if (p > 0) prezzi[NORM(n)] = p; });
  const A = {};
  const get = (nome, catGuess) => {
    const k = NORM(nome);
    if (!A[k]) { const an = ana[k];
      A[k] = {k, nome:k, cat: an ? catOf(an.cat) : catGuess, acq:0, inst:0, serve:0, scorta: an ? Number(an.scorta)||0 : 0,
              prezzo: prezzi[k] || null, forn:'', ultimo:null, ultimaQta:0, mov:[], clienti:[]}; }
    return A[k];
  };
  acquisti.forEach(x => {
    const a = get(x.articolo, 'EXTRA'); const q = Number(x.qta)||0;
    const rett = U(x.fornitore) === 'RETTIFICA';
    a.acq += q; a.mov.push({t: rett ? 'rett' : 'in', data:x.data, q, chi: rett ? (x.note || 'rettifica') : (x.fornitore||'Carico'), doc:x.doc});
    if (!rett && (!a.ultimo || (x.data||'') >= a.ultimo)) { a.ultimo = x.data||''; a.forn = x.fornitore || a.forn; a.ultimaQta = q; }
  });

  const pratiche = [], avvisi = [];
  let senzaMat = 0;
  D.rows.forEach(r => {
    const st = String(r.stato||'').trim().toLowerCase();
    const aperta = /ok\W*da\W*installare/.test(st) || /in\W*lavorazione/.test(st) || /organizzat/.test(st);
    const escl = /sospes|annull/.test(st);
    const cons = !aperta && !escl && st && r.dataInst && inizio && r.dataInst >= inizio;
    if (!aperta && !cons) return;
    const items = [];
    if (String(r.pan||'').trim()) {
      const an = ana[NORM(r.pan)];
      const wp = (an && Number(an.wp)) || Number((String(r.pan).match(/(\d{3})\D*$/)||[])[1]) || 0;
      const q = Number(r.npan) > 0 ? Math.round(Number(r.npan)) : (r.kw > 0 && wp > 0 ? Math.ceil(r.kw*1000/wp - 1e-9) : 0);
      items.push({nome:r.pan, cat:'PANNELLI', q});
      if (!q && aperta) avvisi.push(`<b>${esc(r.nome)}</b>: manca la potenza in kW, non posso calcolare quanti pannelli servono.`);
    }
    [['inv','INVERTER'],['bat','BATTERIA'],['ex1','EXTRA'],['ex2','EXTRA']].forEach(([f,c]) => { if (String(r[f]||'').trim()) items.push({nome:r[f], cat:c, q:1}); });
    items.forEach(it => { const a = get(it.nome, it.cat);
      if (aperta) { a.serve += it.q; a.clienti.push({nome:r.nome, q:it.q, data:r.dataInst, stato:r.stato}); }
      else { a.inst += it.q; a.mov.push({t:'out', data:r.dataInst, q:it.q, chi:r.nome}); } });
    if (aperta) { if (!items.length) senzaMat++; pratiche.push({r, items, org:/organizzat/.test(st), ok:/ok\W*da\W*installare/.test(st) || /organizzat/.test(st)}); }
  });

  const arts = Object.values(A).map(a => { a.giac = a.acq - a.inst; a.ordina = Math.max(0, a.serve + a.scorta - Math.max(0, a.giac)); a.libero = Math.max(0, a.giac - a.serve); return a; });

  /* simulazione: la merce in magazzino va alle installazioni in ordine di data */
  const rem = {}; arts.forEach(a => rem[a.k] = Math.max(0, a.giac));
  pratiche.sort((x,y) => (x.r.dataInst?0:1)-(y.r.dataInst?0:1) || String(x.r.dataInst).localeCompare(String(y.r.dataInst)) || (y.ok-x.ok) || x.r.r-y.r.r);
  pratiche.forEach(p => { p.manca = [];
    p.items.forEach(it => { const k = NORM(it.nome); const take = Math.min(rem[k]||0, it.q); rem[k] = (rem[k]||0) - take; if (it.q - take > 0) p.manca.push({nome:it.nome, q:it.q-take}); });
    p.coperta = p.items.length > 0 && !p.manca.length; });

  const sum = (X,f) => X.reduce((s,a)=>s+f(a),0);
  const valore = sum(arts, a => a.giac > 0 && a.prezzo ? a.giac*a.prezzo : 0);
  const costoOrd = sum(arts, a => a.ordina && a.prezzo ? a.ordina*a.prezzo : 0);
  const senzaPrezzo = arts.filter(a => a.ordina && !a.prezzo).length;
  return {arts, pratiche, avvisi, senzaMat, inizio, valore, costoOrd, senzaPrezzo,
    pezzi: sum(arts, a => Math.max(0,a.giac)), servono: sum(arts, a => a.serve), daOrd: arts.filter(a=>a.ordina>0)};
}

function intelligenza(G){
  const out = [];
  const prog = G.pratiche.filter(p => p.r.dataInst);
  const rischio = prog.find(p => !p.coperta && p.items.length);
  if (G.daOrd.length) {
    const top = G.daOrd.slice().sort((a,b)=>b.ordina-a.ordina).slice(0,3).map(a=>`<b>${a.ordina} × ${esc(parti(a.nome).nome)}</b>`).join(', ');
    out.push(['🛒', `Per coprire tutte le <b>${G.pratiche.length} pratiche aperte</b> devi ordinare ${top}${G.daOrd.length>3?` e altri ${G.daOrd.length-3} articoli`:''}${G.costoOrd?` · circa <b>${eur2.format(G.costoOrd)}</b>`:''}.`]);
  } else out.push(['✅', `Il magazzino copre già tutte le <b>${G.pratiche.length} pratiche aperte</b>. Niente da ordinare.`]);
  if (rischio) out.push(['⚠️', `Prima installazione a rischio: <b>${esc(rischio.r.nome)}</b> il <b>${dIt(rischio.r.dataInst)}</b>, manca ${rischio.manca.map(m=>`${m.q} × ${esc(parti(m.nome).nome)}`).join(', ')}.`]);
  else if (prog.length) out.push(['📅', `Le <b>${prog.length} installazioni programmate</b> hanno tutta la merce in magazzino.`]);
  const liberi = G.arts.filter(a => a.libero > 0).sort((a,b)=>(b.libero*(b.prezzo||0))-(a.libero*(a.prezzo||0)));
  if (liberi.length) out.push(['📦', `Merce in magazzino non ancora assegnata a nessun cliente: ${liberi.slice(0,3).map(a=>`<b>${a.libero} × ${esc(parti(a.nome).nome)}</b>`).join(', ')}${liberi.length>3?'…':''}.`]);
  const pan = G.daOrd.find(a => a.cat === 'PANNELLI' && a.ultimaQta >= 20);
  if (pan) { const b = Math.ceil(pan.ordina/pan.ultimaQta); out.push(['💡', `Pannelli: l'ultimo carico era di ${pan.ultimaQta} pezzi (un bancale?). Per ${pan.ordina} pezzi servono <b>${b} bancali</b> = ${b*pan.ultimaQta} pezzi, ${b*pan.ultimaQta-pan.ordina} di scorta.`]); }
  const scadute = prog.filter(p => p.r.dataInst < oggi());
  if (scadute.length) out.push(['🕒', `${scadute.length===1?'Una pratica ha':scadute.length+' pratiche hanno'} la data di installazione già passata ma risulta ancora aperta: ${scadute.slice(0,3).map(p=>`<b>${esc(p.r.nome)}</b> (${dIt(p.r.dataInst)})`).join(', ')}. Se è installata, aggiorna lo stato: la merce verrà scalata dal magazzino.`]);
  const negativi = G.arts.filter(a => a.giac < 0);
  if (negativi.length) out.push(['🔎', `Magazzino sotto zero: ${negativi.slice(0,3).map(a=>`<b>${esc(parti(a.nome).nome)}</b> (installati ${a.inst}, caricati ${a.acq})`).join(', ')}${negativi.length>3?'…':''}. Sono stati installati più pezzi di quelli registrati in ACQUISTI: aggiungi il carico mancante o correggi l'inventario. Non li conto come da ordinare.`]);
  if (G.avvisi.length) out.push(['✏️', G.avvisi.length === 1 ? G.avvisi[0] : `${G.avvisi.length} pratiche aperte senza kW: non posso calcolare i loro pannelli (${G.avvisi.slice(0,2).map(t=>t.split(':')[0]).join(', ')}…).`]);
  if (G.senzaMat) out.push(['🧩', `${G.senzaMat} pratiche aperte non hanno ancora i materiali compilati nell'archivio: la merce che serve potrebbe essere di più.`]);
  return out.slice(0,6);
}

function testoOrdine(G){
  const g = {}; G.daOrd.forEach(a => (g[a.forn||'Fornitore da scegliere'] = g[a.forn||'Fornitore da scegliere'] || []).push(a));
  let t = `ORDINE GREEN INNOVATION – ${new Date().toLocaleDateString('it-IT')}\n`;
  Object.entries(g).forEach(([f,X]) => { t += `\n${f}\n`; X.forEach(a => t += `• ${a.ordina} × ${a.nome}\n`); });
  return t;
}
function copia(txt){
  const ok = () => toast('Ordine copiato ✓  Incollalo in WhatsApp o in una mail');
  if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(txt).then(ok, () => fallbackCopy(txt, ok));
  else fallbackCopy(txt, ok);
}
function fallbackCopy(txt, ok){ const ta = document.createElement('textarea'); ta.value = txt; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); ok(); } catch(e) { toast('Copia non riuscita'); } ta.remove(); }
function toast(t){ document.querySelectorAll('.toast').forEach(x=>x.remove()); const d = document.createElement('div'); d.className='toast'; d.textContent=t; document.body.appendChild(d); setTimeout(()=>d.remove(), 2800); }

function nomeUtente(){ let n = S.chiMem || ''; try { n = localStorage.getItem('gi_chi') || n; } catch (e) {} return n; }
function salvaNome(n){ S.chiMem = n; try { localStorage.setItem('gi_chi', n); } catch (e) {} }
function chiediNome(poi){ S.sheet = {tipo:'nome', poi}; apriSheet(conAssegnazioni(calcMag())); }
function chiaveAsg(r, art){ return r + '|' + NORM(art); }
function mappaAsg(){
  const m = {};
  ((D.magazzino && D.magazzino.assegnazioni) || []).forEach(x => {
    const row = D.rows.find(r => r.r === Number(x.r));
    if (!row || U(row.nome) !== U(x.cliente)) return; /* la riga dell'archivio non corrisponde più al cliente */
    m[chiaveAsg(x.r, x.articolo)] = Number(x.qta) || 0;
  });
  Object.entries(S.asgLocal || {}).forEach(([k,v]) => { if (v > 0) m[k] = v; else delete m[k]; });
  return m;
}
function conAssegnazioni(G){
  const ASG = mappaAsg();
  G.arts.forEach(a => a.ass = 0);
  const byK = {}; G.arts.forEach(a => byK[a.k] = a);
  G.ok = G.pratiche.slice().sort((x,y) => (x.ok?0:1)-(y.ok?0:1) || (x.r.dataInst?0:1)-(y.r.dataInst?0:1) || String(x.r.dataInst).localeCompare(String(y.r.dataInst)) || x.r.r - y.r.r);
  G.ok.forEach(p => p.items.forEach(it => { const q = ASG[chiaveAsg(p.r.r, it.nome)] || 0; it.asg = q; if (q && byK[NORM(it.nome)]) byK[NORM(it.nome)].ass += q; }));
  G.arts.forEach(a => a.liberi = Math.max(0, a.giac - a.ass));
  G.byK = byK;
  return G;
}

  }

  if (ms === 'ord') {

      <ul>${intelligenza(G).map(([e,t]) => `<li><span class="em">${e}</span><span>${t}</span></li>`).join('')}</ul></div>
      <div class="kpis">
        <div class="card lift kpi-accent"><div class="label">Da ordinare</div><div class="big">${n0.format(G.daOrd.reduce((s,a)=>s+a.ordina,0))} pz</div><div class="muted" style="margin-top:6px">${G.daOrd.length} articoli</div></div>
        ${VEDI_PREZZI ? `<div class="card lift"><div class="label">Ordine stimato</div><div class="big">${eur.format(G.costoOrd)}</div><div class="muted" style="margin-top:6px">${G.senzaPrezzo?G.senzaPrezzo+' articoli senza prezzo':'prezzi dal foglio MATERIALI'}</div></div>` : `<div class="card lift"><div class="label">Articoli da ordinare</div><div class="big">${G.daOrd.length}</div><div class="muted" style="margin-top:6px">tipi di prodotto diversi</div></div>`}
        <div class="card lift"><div class="label">Servono</div><div class="big">${n0.format(G.servono)} pz</div><div class="muted" style="margin-top:6px">per ${G.pratiche.length} pratiche aperte</div></div>
        ${VEDI_PREZZI ? `<div class="card lift"><div class="label">Valore magazzino</div><div class="big">${eur.format(G.valore)}</div><div class="muted" style="margin-top:6px">a prezzo di acquisto</div></div>` : `<div class="card lift"><div class="label">In magazzino</div><div class="big">${n0.format(G.pezzi)} pz</div><div class="muted" style="margin-top:6px">pezzi in casa</div></div>`}
      </div>
      <div class="card"><div class="head"><div><h2>Lista d'ordine</h2><div class="muted">Per coprire tutte le pratiche aperte (organizzate, OK da installare e in lavorazione), raggruppata per ultimo fornitore</div></div>
        <div style="display:flex;gap:8px">${G.daOrd.length?'<button class="pill-dark" id="copia">📋 Copia ordine</button>':''}<button class="pill-light" id="carico">＋ Registra carico</button></div></div>
        ${G.daOrd.length ? Object.entries(gruppi).map(([f,X]) => `<div class="ord-f"><span>${esc(f)}</span><span>${VEDI_PREZZI && X.some(a=>a.prezzo)?eur.format(X.reduce((s,a)=>s+(a.prezzo?a.prezzo*a.ordina:0),0)):''}</span></div>
          ${X.map(a => `<div class="ord-l"><span class="q">${a.ordina}×</span><span class="n" title="${esc(a.nome)}">${esc(a.nome)}</span>${VEDI_PREZZI ? `<span class="p">${a.prezzo?eur.format(a.prezzo*a.ordina):'prezzo ?'}</span>` : ''}</div>`).join('')}`).join('') : '<div class="empty">Niente da ordinare 🎉</div>'}</div>`;
  }

  if (ms === 'cal') {
    const pad = n => String(n).padStart(2,'0'), ymd = d => d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
    const oggi = ymd(new Date()), base = new Date(); base.setDate(1); base.setMonth(base.getMonth() + (S.calM||0));
    const Y = base.getFullYear(), M = base.getMonth();
    const statoMerce = p => {
      const n = p.items.length, f = p.items.filter(it => it.asg).length;
      if (!n) return {c:'nd', t:'Materiali non indicati'};
      if (f === n) return {c:'ok', t:'Merce pronta'};
      const manca = p.items.some(it => !it.asg && !(it.q > 0 && (G.byK[NORM(it.nome)]||{liberi:0}).liberi >= it.q));
      if (manca) return {c:'no', t:'Manca merce'};
      return {c:'wait', t: f ? `Merce assegnata ${f} di ${n}` : 'Merce da assegnare'};
    };
    const evs = G.ok.map(p => ({p, s: statoMerce(p), d: p.r.dataInst || ''}));
    const delGiorno = {}; evs.forEach(e => { if (e.d) (delGiorno[e.d] = delGiorno[e.d] || []).push(e); });
    const inizio = new Date(Y, M, 1), off = (inizio.getDay() + 6) % 7, giorni = new Date(Y, M+1, 0).getDate();
    const celle = [];
    for (let i = 0; i < off; i++) celle.push('<div class="cd vuoto"></div>');
    for (let g = 1; g <= giorni; g++) {
      const k = Y+'-'+pad(M+1)+'-'+pad(g), L = delGiorno[k] || [];
      celle.push(`<div class="cd ${k===oggi?'oggi':''} ${L.length?'pieno':''}"><div class="cn">${g}</div>${L.map(e => `<button class="ce c-${e.s.c} ${e.p.org?'org':''}" data-vai="${e.p.r.r}" title="${esc(e.p.r.nome)} · ${e.p.org?'Organizzata · ':''}${e.s.t}"><span class="cdot"></span><span class="ct">${esc(e.p.r.nome)}</span></button>`).join('')}</div>`);
    }
    const mese = evs.filter(e => e.d.slice(0,7) === Y+'-'+pad(M+1)).sort((a,b) => a.d.localeCompare(b.d));
    const senza = evs.filter(e => !e.d);
    const riga = e => { const d = e.d ? new Date(e.d+'T00:00:00') : null, passata = e.d && e.d < oggi;
      return `<button class="ag" data-vai="${e.p.r.r}"><div class="cal ${d?'':'nd'}"><div class="m">${d?d.toLocaleDateString('it-IT',{month:'short'}).replace('.',''):'—'}</div><div class="d">${d?d.getDate():'?'}</div></div>
        <div class="ag-n"><div class="nm">${esc(e.p.r.nome)}</div><div class="muted">${[d?d.toLocaleDateString('it-IT',{weekday:'long'}):'', cap(e.p.r.comune), e.p.r.kw ? n1.format(e.p.r.kw)+' kWp' : ''].filter(Boolean).join(' · ')}</div></div>
        <div class="ag-r">${fasePill(e.p)}<span class="pill p-${e.s.c}">${e.s.t}</span>${passata?'<span class="pill p-no">Data passata</span>':''}</div></button>`; };
    const titolo = base.toLocaleDateString('it-IT',{month:'long', year:'numeric'});
    body = `<div class="card calm">
      <div class="cal-top"><button class="pill-light" id="cal-prev" aria-label="Mese precedente">‹</button><h2>${titolo.charAt(0).toUpperCase()+titolo.slice(1)}</h2><button class="pill-light" id="cal-next" aria-label="Mese successivo">›</button>${S.calM?'<button class="pill-light" id="cal-oggi">Oggi</button>':''}
        <div class="cal-leg"><span><i class="c-ok"></i>Merce pronta</span><span><i class="c-wait"></i>Da assegnare</span><span><i class="c-no"></i>Manca merce</span><span><i class="c-nd"></i>Materiali non indicati</span><span><b class="leg-org"></b>Organizzata</span></div></div>
      <div class="cgrid">${['Lun','Mar','Mer','Gio','Ven','Sab','Dom'].map(x => `<div class="cw">${x}</div>`).join('')}${celle.join('')}</div></div>
      <div class="card"><div class="title" style="margin-bottom:8px">Installazioni di ${titolo} · ${mese.length}</div>${mese.map(riga).join('') || '<div class="empty">Nessuna installazione in programma questo mese</div>'}</div>
      ${senza.length ? `<div class="card"><div class="title" style="margin-bottom:8px">Senza data di installazione · ${senza.length}</div>${senza.map(riga).join('')}</div>` : ''}`;
  }

  if (ms === 'mov') {
    const movs = G.arts.flatMap(a => a.mov.map(m => ({...m, nome:a.nome}))).filter(m => m.data).sort((a,b) => b.data.localeCompare(a.data)).slice(0,40);
    body = `<div class="card"><div class="head"><div><h2>Movimenti</h2><div class="muted">Carichi dal registro ACQUISTI · scarichi dalle installazioni dal ${dIt(G.inizio)||'—'}</div></div><button class="pill-dark" id="carico">＋ Registra carico</button></div>
      <div style="margin-top:8px">${movs.map(m => movRiga(m, true)).join('') || '<div class="empty">Nessun movimento</div>'}</div></div>`;
  }

  return `<div class="fade" style="display:flex;flex-direction:column;gap:18px">
    <div class="head"><div><h1>Magazzino</h1><p class="sub">Merce in casa e assegnazione ai clienti pronti per l'installazione</p></div><button class="chi-pill" id="chi-btn" title="Il nome viene salvato con ogni modifica">👤 ${esc(nomeUtente() || 'Chi sei?')}</button></div>
    ${nav}${body}</div>`;
}

function movRiga(m, conNome){
  const segno = m.t === 'out' ? '−' : (m.q < 0 ? '−' : '+'), q = Math.abs(m.q);
  const ic = m.t === 'rett' ? '✎' : m.t === 'in' ? '↓' : '↑';
  const col = m.t === 'rett' ? 'var(--info)' : m.t === 'in' ? 'var(--good)' : 'var(--warn)';
  const desc = m.t === 'rett' ? 'Rettifica · ' + esc(m.chi) : m.t === 'in' ? 'Carico da ' + esc(m.chi||'—') : 'Installato da ' + esc(m.chi);
  return `<div class="mv"><span class="b ${m.t}">${ic}</span><div class="t"><div>${conNome ? esc(m.nome) : desc}</div><div>${dIt(m.data)}${conNome ? ' · ' + desc : (m.doc ? ' · ' + esc(m.doc) : '')}</div></div><span class="q" style="color:${col}">${segno}${q}</span></div>`;
}

function salvaAsg(p, modifiche){
  const chi = nomeUtente();
  if (!chi) { chiediNome(() => salvaAsg(p, modifiche)); return; }
  /* modifiche: [{it, qta}] qta 0 = togli */
  S.asgLocal = S.asgLocal || {};
  modifiche.forEach(m => S.asgLocal[chiaveAsg(p.r.r, m.it.nome)] = m.qta);
  render();
  const payload = {r: p.r.r, cliente: p.r.nome, chi, voci: modifiche.map(m => ({articolo: m.it.nome, qta: m.qta}))};
  if (window.google && google.script && google.script.run) {
    google.script.run
      .withSuccessHandler(() => { S.asgReload = true; carica(); })
      .withFailureHandler(e => { modifiche.forEach(m => delete S.asgLocal[chiaveAsg(p.r.r, m.it.nome)]); render(); toast('Non salvato: ' + (e && e.message || e)); })
      .salvaAssegnazioni(payload, CHIAVE);
  } else toast('Anteprima: nel foglio verrebbe salvata l\'assegnazione');
}

function bindMag(G){
  document.querySelectorAll('#msnav button').forEach(b => b.onclick = () => { S.ms = b.dataset.ms; render(); });
  document.getElementById('cal-prev')?.addEventListener('click', () => { S.calM = (S.calM||0) - 1; render(); });
  document.getElementById('cal-next')?.addEventListener('click', () => { S.calM = (S.calM||0) + 1; render(); });
  document.getElementById('cal-oggi')?.addEventListener('click', () => { S.calM = 0; render(); });
  document.querySelectorAll('[data-vai]').forEach(b => b.onclick = () => { const r = b.dataset.vai; S.ms = 'asg'; render();
    const c = document.getElementById('cli-' + r); if (c) { c.scrollIntoView({behavior:'smooth', block:'start'}); c.classList.add('evid'); setTimeout(() => c.classList.remove('evid'), 1600); } });
  document.getElementById('copia')?.addEventListener('click', () => copia(testoOrdine(G)));
  document.getElementById('carico')?.addEventListener('click', () => { S.sheet = {tipo:'carico'}; apriSheet(G); });
  document.querySelectorAll('.sk').forEach(b => b.onclick = e => { const c = e.target.closest('[data-corr]'); S.sheet = c ? {tipo:'rett', k:c.dataset.corr} : {tipo:'art', k:b.dataset.k}; apriSheet(G); });
  document.getElementById('corr-altro')?.addEventListener('click', () => { S.sheet = {tipo:'rett', k:''}; apriSheet(G); });
  document.getElementById('chi-btn')?.addEventListener('click', () => chiediNome(() => render()));
  const trova = r => G.ok.find(p => p.r.r === Number(r));
  document.querySelectorAll('.flag[data-r]').forEach(b => b.onclick = () => {
    const p = trova(b.dataset.r), it = p && p.items[Number(b.dataset.i)]; if (!it) return;
    if (it.asg) { salvaAsg(p, [{it, qta:0}]); toast('Assegnazione tolta'); return; }
    const a = G.byK[NORM(it.nome)] || {liberi:0};
    if (it.q > 0 && a.liberi >= it.q) { salvaAsg(p, [{it, qta:it.q}]); toast(`✓ ${it.q} × ${parti(it.nome).nome} assegnati a ${p.r.nome}`); }
  });
  document.querySelectorAll('[data-tutto]').forEach(b => b.onclick = () => {
    const p = trova(b.dataset.tutto); if (!p) return;
    const lib = {}; G.arts.forEach(a => lib[a.k] = a.liberi);
    const mod = [];
    p.items.forEach(it => { const k = NORM(it.nome); if (!it.asg && it.q > 0 && (lib[k]||0) >= it.q) { lib[k] -= it.q; mod.push({it, qta:it.q}); } });
    if (mod.length) { salvaAsg(p, mod); toast(`✓ ${mod.length} prodotti assegnati a ${p.r.nome}`); }
  });
  document.querySelectorAll('[data-togli]').forEach(b => b.onclick = () => {
    const p = trova(b.dataset.togli); if (!p) return;
    const mod = p.items.filter(it => it.asg).map(it => ({it, qta:0}));
    if (mod.length) { salvaAsg(p, mod); toast('Assegnazioni tolte'); }
  });
  if (S.sheet) apriSheet(G);
}

function apriSheet(G){
  const box = document.getElementById('sheet'); if (!box || !S.sheet) return;
  const chiudi = () => { S.sheet = null; box.innerHTML = ''; if (S.pending) { S.pending = false; render(); } };
  if (S.sheet.tipo === 'art') {
    const a = G.arts.find(x => x.k === S.sheet.k); if (!a) return chiudi(); const p = parti(a.nome);
    const gs = (l,v,c) => `<div class="gs"><div class="l">${l}</div><div class="v" style="${c?'color:'+c:''}">${v}</div></div>`;
    const cl = G.pratiche.flatMap(pr => pr.items.filter(it => NORM(it.nome)===a.k).map(it => ({pr, it, manca:(pr.manca.find(m=>NORM(m.nome)===a.k)||{}).q||0})));
    box.innerHTML = `<div class="sheet-bg" id="sbg"><div class="glass sheet">
      <div class="head"><div style="display:flex;gap:12px;align-items:center"><span class="ico" style="width:42px;height:42px;font-size:20px;border-radius:13px;display:grid;place-items:center;background:${CATS[a.cat].c}22;color:${CATS[a.cat].c}">${CATS[a.cat].i}</span><div><h2 style="font-size:21px">${esc(p.nome)}</h2><div class="muted" style="margin:2px 0 0">${CATS[a.cat].l}${p.tag?' · '+esc(p.tag):''}${a.forn?' · ultimo fornitore '+esc(a.forn):''}${a.prezzo?' · '+eur2.format(a.prezzo)+'/pz':''}</div></div></div><button class="x" id="sx">✕</button></div>
      <div class="stats">${gs('In magazzino',a.giac)}${gs('Servono',a.serve)}${gs('Da ordinare',a.ordina,a.ordina?'var(--bad)':'')}${gs('Liberi',a.libero,a.libero?'var(--info)':'')}</div>
      <div class="muted" style="margin:0 0 8px">Acquistati ${a.acq} · installati ${a.inst} dal ${dIt(G.inizio)||'—'}${a.scorta?` · scorta minima ${a.scorta}`:''}</div>
      <h2 style="font-size:16px;margin-top:14px">Clienti in attesa</h2>
      <div class="tl">${cl.map(({pr,it,manca}) => `<div class="tl-it"><div class="cal ${pr.r.dataInst?'':'nd'}"><div class="m">${pr.r.dataInst?new Date(pr.r.dataInst+'T00:00:00').toLocaleDateString('it-IT',{month:'short'}).replace('.',''):'—'}</div><div class="d">${pr.r.dataInst?new Date(pr.r.dataInst+'T00:00:00').getDate():'?'}</div></div><div class="tl-main"><div class="tl-name">${esc(pr.r.nome)}</div><div class="tl-sub">${it.q} pz · ${cap(pr.r.stato)}</div></div>${manca?`<span class="pill p-no">Mancano ${manca}</span>`:'<span class="pill p-ok">✓ Coperto</span>'}</div>`).join('') || '<div class="empty">Nessun cliente aperto lo aspetta</div>'}</div>
      <h2 style="font-size:16px;margin-top:18px">Movimenti</h2>
      <div class="mov">${a.mov.slice().sort((x,y)=>String(y.data).localeCompare(String(x.data))).map(m => movRiga(m, false)).join('') || '<div class="empty">Nessun movimento</div>'}</div>
      <div class="actions"><button class="pill-dark" id="carica-art">＋ Registra carico di questo articolo</button><button class="pill-light" id="corr-art">✏️ Correggi quantità</button></div>
    </div></div>`;
    document.getElementById('carica-art').onclick = () => { S.sheet = {tipo:'carico', art:a.nome, forn:a.forn, qta:a.ordina||''}; apriSheet(G); };
    document.getElementById('corr-art').onclick = () => { S.sheet = {tipo:'rett', k:a.k}; apriSheet(G); };
  } else if (S.sheet.tipo === 'nome') {
    const poiFn = S.sheet.poi;
    box.innerHTML = `<div class="sheet-bg" id="sbg"><div class="glass sheet" style="width:min(440px,100%)">
      <div class="head"><div><h2 style="font-size:21px">Chi sei?</h2><div class="muted" style="margin:2px 0 0">Il nome viene salvato con ogni modifica al magazzino (flag, carichi, rettifiche)</div></div><button class="x" id="sx">✕</button></div>
      <div class="form"><label class="full">Il tuo nome<input id="n-chi" value="${esc(nomeUtente())}" placeholder="Es. Jacopo"></label></div>
      <div class="actions"><button class="pill-dark" id="n-ok">Continua</button></div></div></div>`;
    const inp = document.getElementById('n-chi'); setTimeout(() => inp.focus(), 50);
    const ok = () => { const n = inp.value.trim(); if (!n) { toast('Scrivi il tuo nome'); return; } salvaNome(n); S.sheet = null; box.innerHTML = ''; if (poiFn) poiFn(n); else render(); };
    document.getElementById('n-ok').onclick = ok;
    inp.onkeydown = e => { if (e.key === 'Enter') ok(); };
  } else if (S.sheet.tipo === 'rett') {
    const nomi = [...new Set([...(D.magazzino.anagrafica||[]).map(x=>x.art), ...G.arts.map(a=>a.nome)])].sort();
    const trova = n => G.arts.find(x => x.k === NORM(n));
    const a0 = S.sheet.k ? G.arts.find(x => x.k === S.sheet.k) : null;
    box.innerHTML = `<div class="sheet-bg" id="sbg"><div class="glass sheet" style="width:min(520px,100%)">
      <div class="head"><div><h2 style="font-size:21px">Correggi quantità</h2><div class="muted" style="margin:2px 0 0">Scrivi quanti pezzi ci sono davvero in magazzino. La differenza viene registrata in ACQUISTI come RETTIFICA, con il tuo nome.</div></div><button class="x" id="sx">✕</button></div>
      <div class="form">
        <label class="full">Articolo<input id="r-art" list="l-art2" value="${esc(a0 ? a0.nome : '')}" placeholder="Scegli l'articolo"></label>
        <div class="gs"><div class="l">Secondo il sistema</div><div class="v" id="r-sys">${a0 ? a0.giac : '—'}</div></div>
        <label>Pezzi contati<input id="r-cnt" type="number" min="0" step="1" value="${a0 ? Math.max(0, a0.giac) : ''}"></label>
        <label>Il tuo nome<input id="r-chi" value="${esc(nomeUtente())}" placeholder="Es. Jacopo"></label>
        <label>Note<input id="r-note" placeholder="Es. conteggio scaffale"></label>
      </div>
      <div class="muted" style="margin-top:12px">Differenza da registrare</div><div class="diff" id="r-diff">—</div>
      <datalist id="l-art2">${nomi.map(n=>`<option value="${esc(n)}">`).join('')}</datalist>
      <div class="actions"><button class="pill-dark" id="r-ok">Salva correzione</button><button class="pill-light" id="r-no">Annulla</button></div>
    </div></div>`;
    const el = id => document.getElementById(id);
    const aggiorna = () => {
      const a = trova(el('r-art').value), sys = a ? a.giac : 0, cnt = el('r-cnt').value === '' ? null : Number(el('r-cnt').value);
      el('r-sys').textContent = el('r-art').value.trim() ? sys : '—';
      if (cnt == null || !el('r-art').value.trim()) { el('r-diff').textContent = '—'; el('r-diff').style.color = ''; return; }
      const d = cnt - sys; el('r-diff').textContent = d === 0 ? 'Nessuna differenza' : (d > 0 ? '+' : '−') + Math.abs(d) + ' pz';
      el('r-diff').style.color = d > 0 ? 'var(--good)' : d < 0 ? 'var(--bad)' : '';
    };
    ['r-art','r-cnt'].forEach(id => el(id).addEventListener('input', aggiorna)); aggiorna();
    el('r-no').onclick = chiudi;
    el('r-ok').onclick = () => {
      const art = el('r-art').value.trim(), cnt = Number(el('r-cnt').value), chi = el('r-chi').value.trim();
      if (!art) { toast('Scegli l\'articolo'); return; }
      if (el('r-cnt').value === '' || !(cnt >= 0) || Math.round(cnt) !== cnt) { toast('Scrivi quanti pezzi hai contato'); return; }
      if (!chi) { toast('Scrivi il tuo nome'); return; }
      const a = trova(art), sys = a ? a.giac : 0, diff = cnt - sys;
      if (diff === 0) { toast('Il numero è già giusto, niente da correggere'); return; }
      salvaNome(chi);
      const x = {articolo: a ? a.nome : art, contati: cnt, attuale: sys, chi, note: el('r-note').value.trim(), data: oggi()};
      const btn = el('r-ok'); btn.textContent = 'Salvo…'; btn.style.opacity = .6;
      if (window.google && google.script && google.script.run) {
        google.script.run.withSuccessHandler(() => { toast(`Corretto ✓  ${parti(x.articolo).nome}: ${cnt} pz`); S.sheet = null; carica(); })
          .withFailureHandler(e => { toast('Errore: ' + (e && e.message || e)); btn.textContent = 'Salva correzione'; btn.style.opacity = 1; })
          .rettificaMagazzino(x, CHIAVE);
      } else { toast('Anteprima: verrebbe registrata una rettifica di ' + (diff > 0 ? '+' : '') + diff); chiudi(); }
    };
  } else {
    const nomi = [...new Set([...(D.magazzino.anagrafica||[]).map(x=>x.art), ...G.arts.map(a=>a.nome)])].sort();
    const forn = [...new Set((D.magazzino.acquisti||[]).map(x=>x.fornitore).filter(Boolean))].sort();
    const s = S.sheet;
    box.innerHTML = `<div class="sheet-bg" id="sbg"><div class="glass sheet" style="width:min(560px,100%)">
      <div class="head"><div><h2 style="font-size:21px">Registra carico</h2><div class="muted" style="margin:2px 0 0">Aggiunge una riga al registro ACQUISTI del foglio</div></div><button class="x" id="sx">✕</button></div>
      <div class="form">
        <label class="full">Articolo<input id="f-art" list="l-art" value="${esc(s.art||'')}" placeholder="Es. EV ${SL2} LONGI 485W"></label>
        <label>Quantità<input id="f-qta" type="number" min="1" step="1" value="${esc(s.qta||'')}"></label>
        <label>Data<input id="f-data" type="date" value="${oggi()}"></label>
        <label>Fornitore<input id="f-forn" list="l-forn" value="${esc(s.forn||'')}"></label>
        <label>DDT / Fattura<input id="f-doc"></label>
        <label>Note<input id="f-note"></label>
        <label>Il tuo nome<input id="f-chi" value="${esc(nomeUtente())}" placeholder="Es. Jacopo"></label>
      </div>
      <datalist id="l-art">${nomi.map(n=>`<option value="${esc(n)}">`).join('')}</datalist>
      <datalist id="l-forn">${forn.map(n=>`<option value="${esc(n)}">`).join('')}</datalist>
      <div class="actions"><button class="pill-dark" id="f-ok">Salva carico</button><button class="pill-light" id="f-no">Annulla</button></div>
    </div></div>`;
    document.getElementById('f-no').onclick = chiudi;
    document.getElementById('f-ok').onclick = () => {
      const v = id => document.getElementById(id).value.trim();
      const c = {articolo:v('f-art'), qta:Number(v('f-qta')), data:v('f-data'), fornitore:v('f-forn'), doc:v('f-doc'), note:v('f-note'), chi:v('f-chi')};
      if (!c.articolo || !(c.qta > 0)) { toast('Inserisci articolo e quantità'); return; }
      if (!c.chi) { toast('Scrivi il tuo nome'); return; }
      salvaNome(c.chi);
      const btn = document.getElementById('f-ok'); btn.textContent = 'Salvo…'; btn.style.opacity = .6;
      if (window.google && google.script && google.script.run) {
        google.script.run.withSuccessHandler(() => { toast(`Carico salvato ✓  ${c.qta} × ${c.articolo}`); S.sheet = null; carica(); })
          .withFailureHandler(e => { toast('Errore: ' + (e && e.message || e)); btn.textContent = 'Salva carico'; btn.style.opacity = 1; })
          .aggiungiCaricoMagazzino(c, CHIAVE);
      } else { toast('Anteprima: nel foglio verrebbe salvato il carico'); chiudi(); }
    };
  }
  document.getElementById('sx').onclick = chiudi;
  document.getElementById('sbg').onclick = e => { if (e.target.id === 'sbg') chiudi(); };
}


</script>
<script>
function toast(m){ const t = document.getElementById('toast'); t.textContent = m; t.classList.add('show'); clearTimeout(window._tt); window._tt = setTimeout(() => t.classList.remove('show'), 2600); }
function tema(set){ const r = document.documentElement; if (set) r.dataset.theme = set; else r.removeAttribute('data-theme'); }
try { const t = localStorage.getItem('gi_tema'); if (t) tema(t); else if (matchMedia('(prefers-color-scheme: dark)').matches) tema('dark'); } catch (e) {}
document.getElementById('themeBtn').onclick = () => { const n = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark'; tema(n); try { localStorage.setItem('gi_tema', n); } catch (e) {} };
document.addEventListener('click', e => {
  const g = e.target.closest('[data-go]'); if (g) { vai(g.dataset.go); return; }
  const t = e.target.closest('[data-todo]'); if (t) { S.todo = t.dataset.todo; vai('pratiche'); setTimeout(() => document.getElementById('dafare')?.scrollIntoView({block:'start'}), 50); return; }
  if (e.target.closest('#plus')) { if (S.view !== 'magazzino') vai('magazzino'); S.sheet = {tipo:'carico'}; apriSheet(calcMag()); }
});
document.getElementById('ask').addEventListener('keydown', e => {
  if (e.key !== 'Enter') return; const q = e.target.value.trim(); if (!q || !D) return;
  const Q = q.toUpperCase();
  const art = (D.magazzino && calcMag().arts.find(a => a.nome.includes(Q)));
  const cli = D.rows.some(r => U(r.nome).includes(Q) || U(r.comune).includes(Q));
  if (MODO === 'magazzino') { if (art) { S.ms = 'disp'; vai('magazzino'); S.sheet = {tipo:'art', k: art.k}; apriSheet(conAssegnazioni(calcMag())); } else { S.ms = 'asg'; vai('magazzino'); } e.target.value = ''; return; }
  if (cli || !art) { S.pq = q; S.pf = ''; vai('pratiche'); }
  else { S.ms = 'disp'; vai('magazzino'); S.sheet = {tipo:'art', k: art.k}; apriSheet(conAssegnazioni(calcMag())); }
  e.target.value = '';
});
document.getElementById('refresh').onclick = () => { carica(); toast('Aggiorno i dati…'); };

function avvia(dati){
  if (!dati || !dati.settings || !dati.rows) { mostraErrore('Il foglio ha risposto senza dati (risposta vuota). Controlla in Apps Script ▸ Esecuzioni l\'ultima esecuzione di getDatiDashboardGlass.'); return; }
  D = dati;
  if (S.anno == null || !anni().includes(S.anno)) S.anno = curY();
  if (S.asgReload) { S.asgLocal = {}; S.asgReload = false; }
  if (S.sheet && ['carico','rett','nome'].includes(S.sheet.tipo)) { S.pending = true; shell(); return; }
  try { render(); } catch (e) { mostraErrore('Errore nel disegnare la sezione "' + S.view + '": ' + (e && e.message) + '\n' + (e && e.stack || '')); }
}
setTimeout(function(){ if (!D && !document.getElementById('errmsg')) mostraErrore('Dopo 40 secondi i dati non sono ancora arrivati dal foglio. Prova a ricaricare; se si ripete, guarda in Apps Script ▸ Esecuzioni se getDatiDashboardGlass dà errore.'); }, 40000);
if (window._errIniziale) mostraErrore(window._errIniziale);
function errore(e){ mostraErrore('Errore dal foglio Google: ' + (e && e.message || e)); }
function carica(){
  if (window.google && google.script && google.script.run) google.script.run.withSuccessHandler(avvia).withFailureHandler(errore).getDatiDashboardGlass(CHIAVE);
  else if (window.__DEMO__) avvia(window.__DEMO__);
}
carica();
let ultimaModifica = null;
function controllaModifiche(){
  if (document.hidden || !(window.google && google.script && google.script.run)) return;
  google.script.run.withSuccessHandler(ts => { if (ultimaModifica !== null && ts !== ultimaModifica) carica(); ultimaModifica = ts; }).getUltimaModificaGlass(CHIAVE);
}
controllaModifiche();
setInterval(controllaModifiche, 15*1000);
setInterval(() => { if (!document.hidden) carica(); }, 10*60*1000);
document.addEventListener('visibilitychange', () => { if (!document.hidden && D) carica(); });
</script>
</body>
